[project]
name = "llm-redteam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yakoub", email = "yakoubbouzit06@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
llm-redteam = "llm_redteam:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
